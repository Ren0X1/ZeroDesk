<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>ZeroDesk · Entrar</title>
<script>try { if (localStorage.getItem('tema') === 'light') document.documentElement.dataset.theme = 'light'; } catch (_) {}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='10' fill='%232DD4BF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css', v=v) }}">
</head>
<body>
<main class="acceso">
  <form method="post">
    <div class="marca">
      {% include "_logo.html" %}
      <span class="marca-t"><b>ZeroDesk</b><span>El PC y el bot, desde cualquier sitio</span></span>
    </div>
    <h1>Entrar</h1>
    <label for="pw">Contraseña del panel</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    {% if error %}<p class="err-text" role="alert">{{ error }}</p>{% endif %}
    <button class="btn prim grande">Entrar</button>
  </form>
</main>
</body>
</html>
